server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Security headers. connect-src must include the API origin (set API_ORIGIN at deploy time
  # by templating this file, or serve the API under the same origin behind /api).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
