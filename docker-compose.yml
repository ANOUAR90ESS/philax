# Local services for development. Optional: you can instead point DATABASE_URL
# at any PostgreSQL 15+ instance with the pgvector extension (e.g. Supabase).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: philax
    ports:
      - '5432:5432'
    volumes:
      - philax-pg:/var/lib/postgresql/data
      - ./database/docker-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  philax-pg:
